spring.application.name=error-free-text

#database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/error_free_text_db
spring.datasource.username=postgres
spring.datasource.password=balabol
spring.datasource.driver-class-name=org.postgresql.Driver

#jpa configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.format_sql=true

#scheduling properties
spring.scheduling.fixed.delay=3000
spring.scheduling.fixed.rate=3000

#yandex speller properties
yandex.speller.url=https://speller.yandex.net/services/spellservice.json/checkTexts