spring.application.name=error-free-text

server.servlet.context-path=/error-free-text
spring.main.allow-bean-definition-overriding=true

#database connection
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#jpa configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql

#scheduling properties
spring.scheduling.fixed.delay=5000
spring.scheduling.fixed.rate=5000

# yandex speller properties
yandex.speller.url=${YANDEX_SPELLER_URL}

# liquibase properties
spring.liquibase.enabled=true

# logging
logging.file.name=logs/app.log
logging.level.root=info
logging.group.tomcat=org.apache.catalina,org.apache.coyote,org.apache.tomcat
logging.level.tomcat=error
logging.level.org.hibernate=error
